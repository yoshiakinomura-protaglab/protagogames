<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カードゲーム - 対戦部屋選択</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="p2p_network.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 360px;
            text-align: center;
        }
        h1 { margin-bottom: 20px; font-size: 22px; }
        .room-list { display: flex; flex-direction: column; gap: 12px; }
        .room-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            padding: 12px 16px;
            border-radius: 8px;
        }
        .room-name { font-weight: bold; font-size: 16px; }
        .status-badge { font-size: 14px; font-weight: bold; }
        .status-empty { color: #aaa; }
        .status-waiting { color: #4dff88; }
        .status-full { color: #ff4d4d; }
        button.join-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button.join-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .loading-text { font-size: 12px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container" id="room-select-screen">
    <h1>対戦部屋を選択</h1>
    <div class="room-list">
        <!-- 部屋 1〜5 -->
        <script>
            for (let i = 1; i <= 5; i++) {
                document.write(`
                    <div class="room-card">
                        <div>
                            <span class="room-name">部屋 ${i}</span>
                            <div id="status-${i}" class="status-badge status-empty">確認中...</div>
                        </div>
                        <button id="btn-${i}" class="join-btn" onclick="selectRoom(${i})">入る</button>
                    </div>
                `);
            }
        </script>
    </div>
    <div class="loading-text" id="reload-info">5秒毎に状態を自動更新中</div>
</div>

<!-- 待機中画面 -->
<div class="container" id="waiting-screen" style="display: none;">
    <h2>対戦相手を待っています...</h2>
    <p style="color: #aaa;">もう1人がこの部屋を選択すると自動でゲームが始まります。</p>
    <div style="margin-top: 20px; font-size: 24px;">⏳</div>
</div>

<script>
    // パスワード保護（既存機能の維持）
    (function checkAuth() {
        if (sessionStorage.getItem('p2p_authenticated') !== 'true') {
            const pass = prompt("スタッフ認証パスワードを入力してください:");
            if (pass === "yamato2026") { // ★パスワード
                sessionStorage.setItem('p2p_authenticated', 'true');
            } else {
                alert("パスワードが違います");
                document.body.innerHTML = "<h1 style='text-align:center;margin-top:20%;'>アクセス制限</h1>";
                window.stop();
            }
        }
    })();

    // 部屋の状態を自動更新する関数
    async function refreshRoomStatuses() {
        for (let i = 1; i <= 5; i++) {
            const statusEl = document.getElementById(`status-${i}`);
            const btnEl = document.getElementById(`btn-${i}`);

            const status = await P2PNetwork.checkRoomStatus(i);

            if (status === 'FULL') {
                statusEl.textContent = "🔴 対戦中 (2/2)";
                statusEl.className = "status-badge status-full";
                btnEl.disabled = true;
            } else if (status === 'WAITING') {
                statusEl.textContent = "🟢 待機中 (1/2)";
                statusEl.className = "status-badge status-waiting";
                btnEl.disabled = false;
            } else {
                statusEl.textContent = "⚪ 空き (0/2)";
                statusEl.className = "status-badge status-empty";
                btnEl.disabled = false;
            }
        }
    }

    // 部屋ボタンを押した時の処理
    function selectRoom(roomNumber) {
        document.getElementById('room-select-screen').style.display = 'none';
        document.getElementById('waiting-screen').style.display = 'block';

        // P2P通信の準備
        p2p.onConnected((isHost) => {
            console.log("接続成功！ゲーム画面へ遷移します。");
            // ゲーム用HTML（game.html）へ遷移するか、メイン描画処理を開始
            window.location.href = `game.html?room=${roomNumber}&host=${isHost}`;
        });

        p2p.enterRoom(roomNumber);
    }

    // 起動時および5秒周期で自動更新
    window.onload = () => {
        refreshRoomStatuses();
        setInterval(refreshRoomStatuses, 5000);
    };
</script>

</body>
</html>
